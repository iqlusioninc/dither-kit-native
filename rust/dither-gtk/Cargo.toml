[package]
name = "dither-gtk"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true

[dependencies]
dither-ir = { path = "../dither-ir" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
glow = "0.18"
libloading = "0.8"

[dev-dependencies]
png = "0.17"
serde_json = "1"
khronos-egl = { version = "6", features = ["dynamic"] }
